<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (event && typeof event.filename === 'string' && event.filename.indexOf('chrome-extension://') === 0) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <title>3D Science Explorer — Belajar Sains Interaktif SMP &amp; SMA</title>
    <meta
      name="description"
      content="Platform pembelajaran sains interaktif 3D untuk siswa SMP dan SMA dengan avatar 3D, kuis gamifikasi, simulasi fisika-astronomi, studio guru, dan panel admin."
    />
    <meta property="og:title" content="3D Science Explorer — Belajar Sains Interaktif SMP &amp; SMA" />
    <meta
      property="og:description"
      content="Platform pembelajaran sains interaktif 3D untuk siswa SMP dan SMA dengan avatar 3D, kuis gamifikasi, simulasi fisika-astronomi, studio guru, dan panel admin."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#app-main">Lewati ke konten utama</a>
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <a href="#dash" class="brand" id="brand-link">3D Science Explorer</a>
        <nav class="topnav" id="nav" aria-label="Navigasi utama"></nav>
        <div class="topbar-action">
          <button type="button" class="btn btn-3d btn-primary btn-sm" id="header-cta">Keluar</button>
        </div>
      </div>
    </header>

    <main id="app-main" class="app-main" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p class="footer-copy">&copy; 2026 3D Science Explorer &middot; Platform Sains Interaktif SMP &amp; SMA</p>
        <nav class="footer-links" aria-label="Tautan cepat">
          <a href="#learn">Materi</a>
          <a href="#quiz">Kuis</a>
          <a href="#sim">Simulasi</a>
          <a href="#lb">Peringkat</a>
        </nav>
      </div>
    </footer>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog id="confirm-dialog" class="modal-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-desc">
      <div class="modal-surface clay-card">
        <h2 id="dialog-title" class="modal-title">Konfirmasi</h2>
        <p id="dialog-desc" class="modal-desc"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="dialog-cancel">Batal</button>
          <button type="button" class="btn btn-3d btn-danger" id="dialog-confirm">Ya, Lanjutkan</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
